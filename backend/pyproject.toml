[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ttkmap-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.115.6",
  "uvicorn[standard]==0.34.0",
  "pydantic==2.10.5",
  "python-multipart==0.0.20",
  "argon2-cffi==23.1.0",
  "Pillow==11.1.0",
  "numpy==2.2.2",
  "PyYAML==6.0.2",
]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["."]
